[env:esp32dev]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
lib_deps =
    nrf24/RF24@1.4.11
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=0
    ; Optional: after discovery, set a 5-byte radio ID (not a pairing code).
    ; -DSMOKE_RADIO_ID=0x8F433B736FULL
    ; Optional: use 10, 40, or 70 for a configured ID (default 10).
    ; -DSMOKE_RF_CHANNEL=40
